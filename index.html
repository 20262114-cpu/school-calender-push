<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>스쿨 캘린더 알림 등록</title><style>body{max-width:38rem;margin:3rem auto;padding:0 1.2rem;font:1.125rem/1.6 system-ui;color:#172540}button{font:inherit;padding:.8rem 1rem;margin:.3rem;background:#2149b7;color:white;border:0;border-radius:.5rem}button:disabled{opacity:.6}</style><h1>스쿨 캘린더 알림</h1><p>일정이 등록·수정·삭제될 때 휴대폰으로 알려 드립니다. 아이폰은 Safari 공유 메뉴에서 이 페이지를 홈 화면에 추가한 뒤, 추가한 아이콘으로 열어 주세요.</p><button id="on" disabled>알림 받기</button><button id="off" disabled>알림 끄기</button><p id="status" role="status">알림 서비스를 불러오는 중…</p><script defer src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" onerror="document.getElementById('status').textContent='알림 서비스를 불러오지 못했습니다.'"></script><script>
window.OneSignalDeferred=window.OneSignalDeferred||[];
window.OneSignalDeferred.push(async function(OneSignal){
 const status=document.getElementById('status'),on=document.getElementById('on'),off=document.getElementById('off');
 try{
  await OneSignal.init({
  appId: '47b2c26b-23d6-4132-93b6-0ff423ce13ea',
  serviceWorkerPath: '/school-calender-push/OneSignalSDKWorker.js',
serviceWorkerParam: { scope: '/school-calender-push/' }
});

  if(!OneSignal.Notifications.isPushSupported()){status.textContent='이 환경에서는 푸시를 사용할 수 없습니다. 지원 브라우저 또는 홈 화면 앱에서 열어 주세요.';return;}
  const sub=OneSignal.User.PushSubscription;
  const update = () => {
  const permission = {
    granted: '허용됨',
    denied: '차단됨',
    default: '아직 선택되지 않음'
  }[Notification.permission] || '확인 불가';

  status.textContent =
    '알림 권한: ' + permission +
    ' · OneSignal 구독: ' + (sub.optedIn ? '켜짐' : '꺼짐') +
    ' · 구독 ID: ' + (sub.id ? '있음' : '없음');
};
 }catch(e){status.textContent='알림 초기화 실패: '+(e?.message || String(e));}
});
</script></html>
